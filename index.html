<!DOCTYPE html>
<html lang="bg">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="256x256" href="favicon-256.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StelDent— Записвания</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root {
  --bg:      #f5f2ed;
  --surface: #ffffff;
  --surface2:#faf9f6;
  --border:  rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text:    #1c1c1c;
  --text2:   #6a6a6a;
  --text3:   #b0a89e;
  --green:   #2a9b6e;
  --green-lt:#e5f4ed;
  --green-dk:#1c7350;
  --radius:  14px;
  --slot-h:  56px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Shell ───────────────────────────────────────────── */
.shell { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

/* ── Header ──────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 0.5px solid var(--border2);
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  height: 58px;
  position: sticky;
  top: 0;
  z-index: 40;
}
  header img {
  height: 45px;
  width: auto;
  object-fit: contain;
}
.brand { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; color: var(--text); white-space: nowrap; }
.brand em { font-style: normal; color: var(--green); }
.week-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.week-label { font-size: 13px; font-weight: 500; color: var(--text); min-width: 180px; text-align: center; }
.hbtn {
  height: 30px; padding: 0 11px; border-radius: 7px;
  border: 0.5px solid var(--border2); background: transparent;
  cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--text2); font-family: 'DM Sans', sans-serif;
  transition: all .12s;
}
.hbtn:hover { background: var(--bg); color: var(--text); }
.hbtn.active { background: var(--green); color: #fff; border-color: var(--green); }
.hbtn.active:hover { background: var(--green-dk); }
.view-toggle { display: flex; gap: 4px; margin-left: 8px; border-left: 0.5px solid var(--border2); padding-left: 12px; }

/* ── Main area ───────────────────────────────────────── */
.main { display: grid; grid-template-columns: 1fr 295px; gap: 0; overflow: hidden; }

/* ── Weekly grid ─────────────────────────────────────── */
.cal-area { overflow: auto; padding: 1rem; }
.week-grid { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius); overflow: hidden; min-width: 720px; }

/* Day header row */
.wg-head { display: grid; grid-template-columns: 52px repeat(var(--num-days,5), 1fr); border-bottom: 1px solid var(--border2); background: var(--surface2); }
.wg-time-hdr { border-right: 0.5px solid var(--border2); }
.day-hdr {
  padding: 10px 8px;
  text-align: center;
  border-left: 0.5px solid var(--border2);
  position: relative;
}
.day-hdr.today-col { background: var(--green-lt); }
.day-name { font-size: 11px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .07em; }
.day-num { font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.1; margin-top: 2px; font-family: 'Playfair Display', serif; }
.day-hdr.today-col .day-num { color: var(--green); }
.chair-labels { display: flex; gap: 0; margin-top: 5px; }
.chair-lbl { flex: 1; font-size: 9px; color: var(--text3); text-align: center; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }

/* Time rows */
.wg-body { position: relative; }
.wg-row { display: grid; grid-template-columns: 52px repeat(var(--num-days,5), 1fr); border-bottom: 0.5px solid var(--border); min-height: var(--slot-h); }
.wg-row:last-child { border-bottom: none; }
.wg-row:nth-child(even) { background: rgba(0,0,0,.015); }
.wg-time { font-size: 10px; color: var(--text3); padding: 8px 6px; text-align: right; border-right: 0.5px solid var(--border2); font-variant-numeric: tabular-nums; }
.day-col { border-left: 0.5px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
.day-col.today-col { background: rgba(42,155,110,.025); }
.chair-slot { padding: 2px; cursor: pointer; border-right: 0.5px dashed var(--border); transition: background .1s; position: relative; overflow: hidden; }
.chair-slot:last-child { border-right: none; }
.chair-slot:not(.occ):hover { background: var(--green-lt); }
.chair-slot.occ { cursor: default; }
.chair-slot.occ:hover { background: transparent; }

/* Appointment block */
.abl {
  border-radius: 6px;
  padding: 4px 6px;
  height: 100%;
  min-height: 50px;
  position: relative;
  overflow: hidden;
  transition: filter .12s;
}
.abl:hover { filter: brightness(.96); }
.abl::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px; background: currentColor; opacity: .4; }
.a-name { font-size: 11px; font-weight: 600; line-height: 1.2; padding-left: 6px; }
.a-proc { font-size: 9px; opacity: .7; margin-top: 1px; padding-left: 6px; }
.a-doc  { font-size: 9px; opacity: .55; margin-top: 1px; padding-left: 6px; }
.a-del  { position: absolute; top: 3px; right: 4px; font-size: 8px; cursor: pointer; opacity: 0; border: none; border-radius: 3px; padding: 1px 4px; background: rgba(0,0,0,.15); color: inherit; font-family: 'DM Sans', sans-serif; transition: opacity .12s; }
.abl:hover .a-del { opacity: 1; }
.add-ph { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 50px; font-size: 15px; color: var(--text3); opacity: 0; transition: opacity .1s; }
.chair-slot:not(.occ):hover .add-ph { opacity: .8; }

/* Doctor color tokens */
.d0 { background: #dff0e9; color: #1a5c40; }
.d1 { background: #d5e9f7; color: #154070; }
.d2 { background: #f6e9d5; color: #7a4010; }
.d3 { background: #ead5f6; color: #4e1a7a; }
.d4 { background: #f6d5da; color: #7a1a28; }

/* ── Sidebar ─────────────────────────────────────────── */
.sidebar {
  border-left: 0.5px solid var(--border2);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  max-height: calc(100vh - 58px);
}
.sb-section { border-bottom: 0.5px solid var(--border2); }
.sb-hdr { padding: 11px 16px; font-size: 12px; font-weight: 600; color: var(--text); background: var(--surface2); display: flex; align-items: center; justify-content: space-between; }
.sb-hdr small { font-weight: 400; color: var(--text2); font-size: 11px; }

/* Booking form */
.form-pad { padding: 12px 16px; display: flex; flex-direction: column; gap: 9px; }
.frow { display: flex; flex-direction: column; gap: 3px; }
.frow label { font-size: 10px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: .07em; }
.frow input, .frow select {
  height: 34px; border-radius: 8px;
  border: 0.5px solid var(--border2);
  background: var(--surface2);
  color: var(--text); font-size: 12px;
  padding: 0 10px;
  font-family: 'DM Sans', sans-serif; width: 100%;
  transition: border-color .12s;
}
.frow input:focus, .frow select:focus { outline: none; border-color: var(--green); background: #fff; }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.errmsg { font-size: 11px; color: #b02020; background: #fde8e8; border-radius: 6px; padding: 6px 10px; display: none; border-left: 3px solid #d04040; }
.sbtn { height: 36px; width: 100%; border-radius: 8px; border: none; background: var(--green); color: #fff; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background .12s; }
.sbtn:hover { background: var(--green-dk); }

/* Doctors */
.doc-list { padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; }
.doc-row { display: flex; align-items: center; gap: 8px; }
.doc-pip { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.doc-inf { flex: 1; min-width: 0; }
.doc-nm  { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-sp  { font-size: 10px; color: var(--text2); }
.doc-bd  { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
.bd-on   { background: #e3f5ec; color: #1a6040; }
.bd-off  { background: #f5e5e5; color: #9a2020; }

/* Week stats */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; padding: 10px 16px; }
.stat-box { background: var(--surface2); border-radius: 8px; padding: 8px 10px; }
.stat-val { font-size: 22px; font-weight: 600; color: var(--text); font-family: 'Playfair Display', serif; }
.stat-lbl { font-size: 10px; color: var(--text2); margin-top: 1px; }

/* ── Day view (toggle) ───────────────────────────────── */
.day-view { display: none; }
.day-view.active { display: block; }
.week-view { display: block; }
.week-view.hidden { display: none; }

/* ── Modal ───────────────────────────────────────────── */
.modal-ov { display: none; position: fixed; inset: 0; background: rgba(20,15,10,.4); z-index: 200; align-items: center; justify-content: center; }
.modal-ov.open { display: flex; }
.modal-box { background: var(--surface); border-radius: 16px; padding: 1.5rem; width: 340px; border: 0.5px solid var(--border2); }
.modal-title { font-family: 'Playfair Display', serif; font-size: 19px; margin-bottom: .85rem; color: var(--text); }
.modal-body { font-size: 13px; color: var(--text2); line-height: 1.85; }
.modal-body b { color: var(--text); font-weight: 500; }
.modal-doc-badge { display: inline-block; border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 500; margin-top: 6px; }
.modal-acts { display: flex; gap: 8px; margin-top: 1.1rem; justify-content: flex-end; }
.btn-del { background: #fde8e8; color: #a33; border: 0.5px solid #f5c5c5; border-radius: 7px; padding: 0 12px; height: 30px; cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif; }
.btn-del:hover { background: #f9d5d5; }

/* ── Toast ───────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(12px);
  background: #1c1c1c; color: #fff; font-size: 12px; font-weight: 400;
  padding: 9px 16px; border-radius: 8px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 300;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .sidebar { max-height: none; border-left: none; border-top: 0.5px solid var(--border2); }
}
</style>
</head>
<body>
<div class="shell">

<!-- ── Header ── -->
  <header>
  <img src="Лого СтелДент.webp" alt="StelDent Logo" style="height: 45px; width: auto; object-fit: contain;">
  <div class="brand">Stel<em></em>Dent</div>
    <div class="week-nav">
    <button class="hbtn" onclick="shiftWeek(-1)">&#8592; Предишна</button>

<!-- ── Main ── -->
<div class="main">

  <!-- Calendar area -->
  <div class="cal-area">

      <div class="wg-head" id="wgHead"></div>
      <div class="wg-body" id="wgBody"></div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">

    <!-- Booking form -->
    <div class="sb-section">
      <div class="sb-hdr">Ново записване <small id="formHint">изберете слот ←</small></div>
      <div class="form-pad">
        <div class="frow"><label>Пациент</label><input id="fPt" type="text" placeholder="Иван Иванов"></div>
        <div class="frow"><label>Телефон</label><input id="fTl" type="tel" placeholder="0888 123 456"></div>
        <div class="frow">
          <label style="display:flex;align-items:center;justify-content:space-between;">
            И-мейл
            <span style="font-size:9px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0;">за потвърждение</span>
          </label>
          <input id="fEm" type="email" placeholder="ivan@example.com">
        </div>
        <div class="frow"><label>Процедура</label>
          <select id="fPr" style="height:34px;"></select>
        </div>
        <div class="form-2col">
          <div class="frow"><label>Лекар</label><select id="fDc"></select></div>
          <div class="frow"><label>Кабинет</label>
          <select id="fCh" style="height:34px;"></select>
          </div>
        </div>
        <div class="form-2col">
          <div class="frow"><label>Ден</label><select id="fDay"></select></div>
          <div class="frow"><label>Час</label><select id="fHr"></select></div>
        </div>
        <div class="errmsg" id="errMsg"></div>
        <button class="sbtn" onclick="addAppt()">Запази час</button>
      </div>
    </div>

    <!-- Doctors this week -->
    <div class="sb-section">
      <div class="sb-hdr">Лекари</div>
      <div class="doc-list" id="docList"></div>
    </div>

    <!-- Week stats -->
    <div class="sb-section">
      <div class="sb-hdr">Статистика за седмицата</div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

  </div>
</div>
</div>

<!-- ── Modal ── -->
<div class="modal-ov" id="modalOv">
  <div class="modal-box">
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-acts">
      <button class="hbtn" onclick="closeModal()">Затвори</button>
      <button class="hbtn" id="mGcal" style="color:#2a9b6e;border-color:#2a9b6e;">📅 Изтегли .ics</button>
      <button class="btn-del" onclick="deleteFromModal()">Изтрий</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>
// ── Helpers & constants (declared before use) ──────────────────────────────
const BG_DAYS_SHORT = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const BG_DAYS_FULL  = ['Неделя','Понеделник','Вторник','Сряда','Четвъртък','Петък','Събота'];
const BG_MON        = ['ян.','фев.','март','апр.','май','юни','юли','авг.','сеп.','окт.','ноем.','дек.'];
const BG_MON_FULL   = ['януари','февруари','март','април','май','юни','юли','август','септември','октомври','ноември','декември'];
const SLOTS = [];
for (let h = 9; h < 18; h++) { SLOTS.push(h+':00'); SLOTS.push(h+':30'); }
const fmt = t => { const [h,m] = t.split(':'); return h.padStart(2,'0')+':'+(m||'00'); };

function getMonday(d) {
  const x = new Date(d); const day = x.getDay()||7;
  if (day!==1) x.setDate(x.getDate()-(day-1));
  x.setHours(0,0,0,0); return x;
}
function addDays(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function dk(d) { return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function sameDay(a,b) { return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
// Build the set of working days from doctor config (union of all days any doctor works)
function getWorkDayOffsets() {
  // Collect all unique day-of-week values across doctors
  const dowSet = new Set();
  DOCTORS.forEach(d => d.days.forEach(dow => dowSet.add(dow)));
   // Always include Saturday (dow=6) even if no doctors work that day
  dowSet.add(6);
  // Build offsets from Monday (dow=1) through Saturday (dow=6) and Sunday (dow=0) in order Mon..Sun
  const ordered = [1,2,3,4,5,6,0].filter(dow => dowSet.has(dow));
  // Convert dow values to offsets from Monday
  return ordered.map(dow => dow === 0 ? 6 : dow - 1);
}
function weekDays() {
  const offsets = getWorkDayOffsets();
  return offsets.map(i => addDays(weekStart, i));
}

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = (type==='ok' ? '✓ ' : '✕ ') + msg;
  t.className = 'toast show';
  t.style.background = type==='ok' ? '#2a9b6e' : '#c0392b';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 4000);
}

// ── Global config variables (will be loaded from Supabase) ────────────────
let DOCTORS = [];
let CHAIRS = [{name:'Кабинет 1',desc:'Общи процедури'},{name:'Кабинет 2',desc:'Специализиран'}];
let SERVICES = [{name:'Преглед',duration:30},{name:'Почистване',duration:60},{name:'Пломба',duration:45},{name:'Извличане',duration:45},{name:'Протеза',duration:90},{name:'Имплант',duration:120},{name:'Избелване',duration:60},{name:'Ортодонтска консултация',duration:45},{name:'Рентген',duration:20}];
let CONFIG_LOADED = false;

// ── Load config from Supabase ──────────────────────────────────────────────
async function loadConfig() {
  try {
    console.log('📡 Зареждане на конфигурация от Supabase...');
    const rows = await sbFetch('config?id=eq.main&select=*');
    
    if (!rows || rows.length === 0) {
      console.warn('⚠ Няма конфигурация в базата данни');
      showConfigWarning();
      return false;
    }
    
    const cfg = rows[0];
    console.log('✓ Конфигурация заредена:', cfg);
    
    // Load doctors
    if (cfg.doctors && cfg.doctors.length > 0) {
      DOCTORS = cfg.doctors.map((d,i)=>({
        n:d.name, s:d.spec, c:i, 
        color:d.color, textColor:d.textColor,
        days:d.days, sh:d.sh, eh:d.eh
      }));
      console.log('✓ Заредени лекари:', DOCTORS.length);
    } else {
      console.warn('⚠ Няма лекари в конфигурацията');
      showConfigWarning();
      return false;
    }
    
    // Load chairs
    if (cfg.chairs && cfg.chairs.length > 0) {
      CHAIRS = cfg.chairs;
    }
    
    // Load services
    if (cfg.services && cfg.services.length > 0) {
      SERVICES = cfg.services.map(s => typeof s === 'string' ? {name: s, duration: 30} : s);
    }
    
    // Load EmailJS config
    if (cfg.emailjs) {
      if (cfg.emailjs.pk) window.EMAILJS_PUBLIC_KEY = cfg.emailjs.pk;
      if (cfg.emailjs.sid) window.EMAILJS_SERVICE_ID = cfg.emailjs.sid;
      if (cfg.emailjs.tid) window.EMAILJS_TEMPLATE_ID = cfg.emailjs.tid;
    }
    
    // Load social links
    if (cfg.social && cfg.social.length > 0) {
      renderSocialBar(cfg.social);
    }
    
    CONFIG_LOADED = true;
    return true;
  } catch(e) {
    console.error('✕ Грешка при зареждане на конфигурация:', e);
    showConfigWarning();
    return false;
  }
}

function showConfigWarning() {
  const warning = document.createElement('div');
  warning.style.cssText = 'position:fixed;top:58px;left:0;right:0;background:#fff3cd;color:#856404;padding:8px 16px;text-align:center;font-size:12px;border-bottom:1px solid #ffeaa7;z-index:100;';
  warning.innerHTML = '⚠ Няма въведени лекари. <a href="admin.html" style="color:#856404;font-weight:600;">Отидете в Администрация</a> за да добавите лекари и конфигурация.';
  document.body.appendChild(warning);
}

function renderSocialBar(social) {
  if (!social || social.length === 0) return;
  const links = social.filter(s => s.url);
  if (links.length === 0) return;
  
  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:6px;align-items:center;padding:0 0 0.75rem;';
  bar.innerHTML = '<span style="font-size:11px;color:var(--text3);font-weight:500;">Намерете ни:</span>' +
    links.map(s => `<a href="${s.url}" target="_blank" style="width:28px;height:28px;border-radius:6px;background:${s.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-decoration:none;">${s.icon}</a>`).join('');
  document.querySelector('.cal-area').prepend(bar);
}

// ── EmailJS (will be initialized after config loads) ──────────────────────
window.EMAILJS_PUBLIC_KEY = '-8kuax0A8j3n5xm9h';
window.EMAILJS_SERVICE_ID = 'zikolov@abv.bg';
window.EMAILJS_TEMPLATE_ID = 'template_b5q2rqr';

function initEmailJS() {
  if (typeof emailjs !== 'undefined') {
    emailjs.init({ publicKey: window.EMAILJS_PUBLIC_KEY });
  }
}

async function sendConfirmation(appt, dateObj) {
  if (!appt.email) return;
  if (typeof emailjs === 'undefined') {
    showToast('EmailJS не е заредено!', 'err');
    return;
  }
  const doc = DOCTORS[appt.di];
  const params = {
    email: appt.email, to_email: appt.email, to_name: appt.pt,
    date: BG_DAYS_FULL[dateObj.getDay()]+', '+dateObj.getDate()+' '+BG_MON_FULL[dateObj.getMonth()]+' '+dateObj.getFullYear(),
    time: fmt(appt.time), doctor: doc.n, procedure: appt.pr,
    chair: CHAIRS[appt.chair]?CHAIRS[appt.chair].name:'Кабинет '+(appt.chair+1), phone: appt.tel||'—',
  };
  try {
    const result = await emailjs.send(window.EMAILJS_SERVICE_ID, window.EMAILJS_TEMPLATE_ID, params);
    if (result.status === 200) {
      showToast('✉ Потвърждение изпратено до '+appt.email, 'ok');
    } else {
      showToast('Неочакван отговор: '+result.status, 'err');
    }
  } catch(err) {
    const msg = err.text || err.message || JSON.stringify(err);
    showToast('Грешка: '+msg, 'err');
    console.error('EmailJS error:', err);
  }
}

const TODAY = new Date();
let weekStart = getMonday(TODAY);
let appointments = {};
let nextId = 1;

function appts(d) { return appointments[dk(d)]||[]; }
function slotFree(d,chair,time) { return !appts(d).find(a=>a.chair===chair&&a.time===time); }
function docFree(d,di,time) {
  const doc=DOCTORS[di]; if(!doc) return false;
  const dow=d.getDay(); if(!doc.days.includes(dow)) return false;
  const [th,tm]=time.split(':').map(Number); const mins=th*60+(tm||0);
  if(mins<doc.sh*60||mins>=doc.eh*60) return false;
  return !appts(d).find(a=>a.di===di&&a.time===time);
}

// ── Render: Week Body ──────────────────────────────────────────────────────
function renderBody() {

  el.innerHTML=SLOTS.map(time=>{
    const cols=days.map(d=>{
      const isTod=sameDay(d,TODAY);

            </div></div>`;

        return `<div class="chair-slot" onclick="prefill('${dk(d)}',${chair},'${time}')"><div class="add-ph">+</div></div>`;

    }).join('');

// ── Render: Doctor list ────────────────────────────────────────────────────
function renderDoctors() {
  const days=weekDays(); const el=document.getElementById('docList');
  el.innerHTML=DOCTORS.map((d,i)=>{

// ── Render: Stats ──────────────────────────────────────────────────────────
function renderStats() {
  const days=weekDays(); const a=days.reduce((s,d)=>s+appts(d).length,0);
  const fs=CHAIRS.map((_,ci)=>days.reduce((s,d)=>s+SLOTS.filter(t=>slotFree(d,ci,t)).length,0));
  const fTotal=fs.reduce((s,v)=>s+v,0);
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-box"><div class="stat-val">${a}</div><div class="stat-lbl">Записвания</div></div>
    <div class="stat-box"><div class="stat-val">${fTotal}</div><div class="stat-lbl">Свободни слота</div></div>
    ${fs.map((f,i)=>`<div class="stat-box"><div class="stat-val">${f}</div><div class="stat-lbl">${CHAIRS[i].name} свободни</div></div>`).join('')}`;
}

function renderDocForDay(dayIdx) {
  const days=weekDays(); const d=days[dayIdx]; const dow=d.getDay();
  const sel=document.getElementById('fDc');
  sel.innerHTML=DOCTORS.map((doc,i)=>{
    const off=!doc.days.includes(dow);

  }).join('');
  const first=DOCTORS.findIndex(doc=>doc.days.includes(dow));
  if(first>=0) sel.value=first;
}

async function sbFetch(path, opts={}) {
  const r = await fetch(SB_URL+'/rest/v1/'+path, { headers: SB_HDR, ...opts });
  if (!r.ok) { const e=await r.text(); throw new Error(e); }
  if (r.status===204) return null;
  const text = await r.text();
  if (!text || text.trim()==='') return null;
  return JSON.parse(text);

// Convert DB row → local appointment object
function rowToAppt(row) {
  return {
    id: row.id, pt: row.patient, tel: row.phone||'', email: row.email||'',
    di: row.doctor_idx, pr: row.procedure, chair: row.chair, time: row.time,
  };
}

// Load ALL appointments from Supabase into local cache
async function loadFromDB() {
  showLoader(true);
  try {
    const rows = await sbFetch('appointments?select=*&order=time.asc');
    appointments = {};
    rows.forEach(row => {
      const k = row.date;
      if (!appointments[k]) appointments[k] = [];
      appointments[k].push(rowToAppt(row));
    });
  } catch(e) {
    showToast('Грешка при зареждане: '+e.message, 'err');
  }
  showLoader(false);
  renderAll();
}

// Save one appointment to Supabase
async function saveToDB(appt, dateKey) {
  const body = JSON.stringify({
    id: appt.id,
    date: dateKey,
    patient: appt.pt,
    phone: appt.tel,
    email: appt.email,
    doctor_idx: appt.di,
    procedure: appt.pr,
    chair: appt.chair,
    time: appt.time,
  });
  await sbFetch('appointments', {
    method: 'POST',
    headers: { ...SB_HDR, 'Prefer': 'return=minimal' },
    body,
  });
}

async function deleteFromDB(id) {

}

async function addAppt() {
  const pt=document.getElementById('fPt').value.trim();
  const tel=document.getElementById('fTl').value.trim();
  const em2=document.getElementById('fEm').value.trim();
  const di=parseInt(document.getElementById('fDc').value);
  const pr=document.getElementById('fPr').value;
  const chair=parseInt(document.getElementById('fCh').value);
  const time=document.getElementById('fHr').value;
  const dayI=parseInt(document.getElementById('fDay').value);
  const em=document.getElementById('errMsg'); const d=weekDays()[dayI];
  const dateKey=dk(d);

  if(!pt){em.textContent='Моля въведете името на пациента.';em.style.display='block';return;}
  if(!slotFree(d,chair,time)){em.textContent=CHAIRS[chair].name+' е зает в '+fmt(time)+' в '+BG_DAYS_FULL[d.getDay()]+'.';em.style.display='block';return;}
  if(!docFree(d,di,time)){em.textContent=DOCTORS[di].n+' не е свободен/на в '+fmt(time)+'.';em.style.display='block';return;}
  em.style.display='none';

  // Optimistic UI update
  const newAppt={id:crypto.randomUUID(),pt,tel,email:em2,di,pr,chair,time};
  if(!appointments[dateKey]) appointments[dateKey]=[];
  appointments[dateKey].push(newAppt);
  document.getElementById('fPt').value=''; document.getElementById('fTl').value=''; document.getElementById('fEm').value='';
  document.getElementById('formHint').textContent='изберете слот ←'; pending=null; renderAll();

  try {
    await saveToDB(newAppt, dateKey);
    showICSToast(newAppt, dateKey);
    if(em2) await sendConfirmation(newAppt, d);
  } catch(e) {
    // Rollback on error
    appointments[dateKey]=appointments[dateKey].filter(a=>a.id!==newAppt.id);
    renderAll();
    showToast('Грешка при запазване: '+e.message, 'err');
  }
}

async function deleteAppt(id, dateKey) {
  // Optimistic UI
  if(appointments[dateKey]) appointments[dateKey]=appointments[dateKey].filter(a=>a.id!==id);
  renderAll();
  try {
    await deleteFromDB(id);
  } catch(e) {
    showToast('Грешка при изтриване: '+e.message, 'err');
    loadFromDB(); // reload to restore correct state
  }
}

// ── .ics Calendar export ───────────────────────────────────────────────────
function downloadICS(appt, dateKey) {
  const doc   = DOCTORS[appt.di] || {n:'—', s:'—'};
  const svc   = SERVICES.find(s => s.name === appt.pr) || {duration: 30};
  const chair = CHAIRS[appt.chair]?.name || ('Кабинет ' + (appt.chair + 1));

  // Parse dateKey 'YYYY-M-D' safely
  const [year, month, day] = dateKey.split('-').map(Number);
  const [startH, startM]   = (appt.time || '9:00').split(':').map(Number);

  const pad  = n => String(n).padStart(2, '0');

  // Local datetime string (TZID form — works correctly in Sofia/EET)
  const toLocal = (y, mo, d, h, m) =>
    `${y}${pad(mo)}${pad(d)}T${pad(h)}${pad(m)}00`;

  const endMin  = startM + svc.duration;
  const endH    = startH + Math.floor(endMin / 60);
  const endMFin = endMin % 60;

  // UTC stamp for DTSTAMP
  const now   = new Date();
  const stamp = now.getUTCFullYear() + pad(now.getUTCMonth()+1) + pad(now.getUTCDate()) +
                'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + 'Z';

  // RFC 5545 line folding (max 75 octets per line)
  function fold(line) {
    const bytes = new TextEncoder().encode(line);
    if (bytes.length <= 75) return line;
    const out = []; let cur = '';
    for (const ch of line) {
      const test = cur + ch;
      if (new TextEncoder().encode(test).length > 75) { out.push(cur); cur = ' ' + ch; }
      else cur = test;
    }
    if (cur) out.push(cur);
    return out.join('\r\n');
  }

  const desc = [
    'Пациент: ' + appt.pt,
    'Лекар: ' + doc.n + ' (' + doc.s + ')',
    chair,
    appt.tel ? 'Тел: ' + appt.tel : '',
    appt.email ? 'И-мейл: ' + appt.email : '',
  ].filter(Boolean).join('\\n');

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//StelDent//StelDent Calendar//BG',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'X-WR-CALNAME:StelDent',
    'X-WR-TIMEZONE:Europe/Sofia',
    'BEGIN:VTIMEZONE',
    'TZID:Europe/Sofia',
    'BEGIN:STANDARD',
    'DTSTART:19701025T040000',
    'RRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=10',
    'TZOFFSETFROM:+0300',
    'TZOFFSETTO:+0200',
    'TZNAME:EET',
    'END:STANDARD',
    'BEGIN:DAYLIGHT',
    'DTSTART:19700329T030000',
    'RRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=3',
    'TZOFFSETFROM:+0200',
    'TZOFFSETTO:+0300',
    'TZNAME:EEST',
    'END:DAYLIGHT',
    'END:VTIMEZONE',
    'BEGIN:VEVENT',
    fold('UID:' + appt.id + '@steldent.bg'),
    'DTSTAMP:' + stamp,
    fold('DTSTART;TZID=Europe/Sofia:' + toLocal(year, month, day, startH, startM)),
    fold('DTEND;TZID=Europe/Sofia:'   + toLocal(year, month, day, endH,   endMFin)),
    fold('SUMMARY:' + appt.pr + ' \u2013 ' + appt.pt),
    fold('DESCRIPTION:' + desc),
    fold('LOCATION:StelDent, ' + chair),
    fold('ORGANIZER;CN=StelDent:mailto:info@steldent.bg'),
    appt.email ? fold('ATTENDEE;CN=' + appt.pt + ';RSVP=FALSE:mailto:' + appt.email) : '',
    'STATUS:CONFIRMED',
    'TRANSP:OPAQUE',
    'BEGIN:VALARM',
    'TRIGGER:-PT30M',
    'ACTION:DISPLAY',
    fold('DESCRIPTION:Напомняне: ' + appt.pr + ' при StelDent'),
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR',
  ].filter(l => l !== '').join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'steldent-' + appt.pt.replace(/\s+/g, '-') + '-' + dateKey + '.ics';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

    'font-size:11px;font-weight:600;cursor:pointer;margin-left:6px;font-family:\'DM Sans\',sans-serif;">' +

  clearTimeout(t._timer);

}

// ── Start: load config and appointments from Supabase ──────────────────────
async function initialize() {
  showLoader(true);
  
  // 1. Load configuration first
  const configOk = await loadConfig();
  
  if (!configOk || DOCTORS.length === 0) {
    showLoader(false);
    console.error('❌ Не може да се зареди конфигурация или няма въведени лекари');
    // Show empty state but don't crash
    renderAll();
    return;
  }
  
  // 2. Initialize EmailJS with loaded config
  initEmailJS();
  
  // 3. Initialize form elements with loaded data
  initFormElements();
  
  // 4. Load appointments
  await loadFromDB();
  
  showLoader(false);
}
